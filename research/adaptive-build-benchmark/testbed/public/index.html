<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendPulse - Expense Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>SpendPulse</h1>
        <p class="subtitle">Team Expense &amp; Approval Tracker</p>
      </div>
      <div class="header-actions">
        <button id="exportBtn" class="btn">Export CSV</button>
        <button id="resetBtn" class="btn">Reset Filters</button>
        <button id="newExpenseBtn" class="btn">+ New Expense</button>
      </div>
    </header>

    <section class="kpis" aria-label="Summary metrics">
      <div class="kpi-card">
        <span class="kpi-label">Approved Spend</span>
        <span id="kpiApproved" class="kpi-value">$0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Pending Approval</span>
        <span id="kpiPending" class="kpi-value">$0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Visible Items</span>
        <span id="kpiCount" class="kpi-value">0</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-status="ALL">All</button>
        <button class="tab" data-status="PENDING_L2_APPROVAL">Pending Approval</button>
        <button class="tab" data-status="APPROVED">Approved</button>
        <button class="tab" data-status="REJECTED">Rejected</button>
      </div>
      <input id="searchInput" class="search-input" type="text" placeholder="Search title, requester, category..." />
    </section>

    <div id="bulkBanner" class="bulk-banner">
      <span id="bulkCount">0 selected</span>
    </div>

    <main class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Expense</th>
            <th>Category</th>
            <th>Requester</th>
            <th>Created</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenseRows"></tbody>
      </table>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">New Expense</h2>
      <form id="expenseForm">
        <label>
          Title
          <input name="title" required placeholder="e.g. Conference travel" />
        </label>
        <label>
          Requester
          <input name="requesterName" required placeholder="Your name" />
        </label>
        <label>
          Category
          <select name="category">
            <option value="Infrastructure">Infrastructure</option>
            <option value="Travel">Travel</option>
            <option value="Software">Software</option>
            <option value="Team Events">Team Events</option>
            <option value="Hardware">Hardware</option>
          </select>
        </label>
        <label>
          Amount (USD)
          <input name="amount" type="number" step="0.01" min="0.01" required placeholder="125.00" />
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn">Cancel</button>
          <button type="submit" id="submitExpenseBtn" class="btn">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
